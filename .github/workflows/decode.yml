name: decode-photo
on:
  push:
    paths:
      - photo.b64
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d photo.b64 > bahy-eldin-ahmed.jpg
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm -q photo.b64
          git add bahy-eldin-ahmed.jpg
          git commit -m "Add profile photo"
          git push
